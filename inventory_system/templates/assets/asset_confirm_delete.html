{% extends 'base.html' %}

{% block title %}Подтвердить удаление{% endblock %}

{% block content %}
    <h2>Удалить ценность</h2>
    <p>Вы уверены, что хотите удалить "{{ object }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'assets:asset_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
{% endblock %}
