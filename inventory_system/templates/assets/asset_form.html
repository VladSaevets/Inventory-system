{% extends 'base.html' %}

{% block title %}Редактирование записи{% endblock %}

{% block content %}
    <h2>{{ view.object.pk|yesno:"Редактировать ценность,Добавить ценность" }}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'assets:asset_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
{% endblock %}
